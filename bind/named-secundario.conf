// Configuración del servidor DNS SECUNDARIO (ns2) - Grupo 6
// No tiene archivos de zona propios: los copia del primario (ns1)

// Clave TSIG compartida con ns1 para autenticar las transferencias de zona
include "/etc/bind/tsig.key";

options {
    directory "/var/cache/bind";       // Acá guarda las copias de las zonas recibidas
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };

    // Misma resolución externa que el primario, para que el cliente
    // pueda seguir resolviendo todo si ns1 se cae
    recursion yes;
    allow-recursion { 172.30.6.0/24; };
    forwarders { 1.1.1.1; 8.8.8.8; };
    forward only;
};

// Copia de la zona directa
zone "grupo6.lab" {
    type secondary;                                  // Recibe la zona de un primario
    primaries { 172.30.6.10 key "transfer-grupo6"; }; // Primario (ns1); los pedidos van firmados con la clave
    file "db.lab.sec";                               // Dónde guarda la copia (dentro de /var/cache/bind)
    masterfile-format text;                          // Guarda la copia en texto legible (por defecto es binario)
};

// Copia de la zona inversa
zone "6.30.172.in-addr.arpa" {
    type secondary;
    primaries { 172.30.6.10 key "transfer-grupo6"; };
    file "db.172.30.6.sec";
    masterfile-format text;
};
