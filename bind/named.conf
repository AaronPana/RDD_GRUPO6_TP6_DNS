// Configuración del servidor DNS PRIMARIO (ns1) - Grupo 6

// Clave TSIG compartida con ns2 para autenticar las transferencias de zona
include "/etc/bind/tsig.key";

options {
    directory "/var/cache/bind";       // Directorio de trabajo de BIND
    listen-on { any; };                // Escucha consultas IPv4 en todas sus interfaces
    listen-on-v6 { none; };            // No usamos IPv6
    allow-query { any; };              // Cualquiera puede consultar nuestras zonas

    // Resolución de nombres externos (ej: google.com)
    recursion yes;                     // Acepta resolver nombres que no son de sus zonas...
    allow-recursion { 172.30.6.0/24; };// ...pero solo para equipos de nuestra red
    forwarders { 1.1.1.1; 8.8.8.8; };  // Reenvía esas consultas a Cloudflare y Google
    forward only;                      // Siempre usa los forwarders, no recorre la jerarquía solo
};

// Zona directa: nombre -> IP
zone "grupo6.lab" {
    type primary;                            // Este servidor tiene la copia original de la zona
    file "/etc/bind/db.lab";
    allow-transfer { key "transfer-grupo6"; }; // Solo entrega la zona a pedidos firmados con la clave
    also-notify { 172.30.6.11; };            // Avisa a ns2 cuando la zona cambia (NOTIFY)
};

// Zona inversa: IP -> nombre, para la red 172.30.6.0/24
zone "6.30.172.in-addr.arpa" {
    type primary;
    file "/etc/bind/db.172.30.6";
    allow-transfer { key "transfer-grupo6"; };
    also-notify { 172.30.6.11; };
};
